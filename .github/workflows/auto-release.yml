name: Auto Release on Version Change

on:
  push:
    branches: [main]
    paths:
      - "crates/types/Cargo.toml"
      - "crates/client/Cargo.toml"
      - "crates/core/Cargo.toml"
      - "bindings/python/Cargo.toml"
      - "crates/server/Cargo.toml"
      - "crates/cabi/Cargo.toml"
      - "bindings/go/VERSION"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------- STAGE 1: WAIT FOR CI ----------------
  wait-for-ci:
    name: Wait for CI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow to complete
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          running-workflow-name: "Wait for CI Tests"
          check-regexp: '^(Test Suite|Test on .+|Go bindings on .+|Documentation)$'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  # ---------------- STAGE 2: DETECT ----------------
  detect-changes:
    name: Detect Version Changes
    runs-on: ubuntu-latest
    needs: wait-for-ci
    outputs:
      types-changed: ${{ steps.detect.outputs.types-changed }}
      types-version: ${{ steps.detect.outputs.types-version }}
      core-changed: ${{ steps.detect.outputs.core-changed }}
      core-version: ${{ steps.detect.outputs.core-version }}
      server-changed: ${{ steps.detect.outputs.server-changed }}
      server-version: ${{ steps.detect.outputs.server-version }}
      client-changed: ${{ steps.detect.outputs.client-changed }}
      client-version: ${{ steps.detect.outputs.client-version }}
      python-changed: ${{ steps.detect.outputs.python-changed }}
      python-version: ${{ steps.detect.outputs.python-version }}
      cabi-changed: ${{ steps.detect.outputs.cabi-changed }}
      cabi-version: ${{ steps.detect.outputs.cabi-version }}
      go-changed: ${{ steps.detect.outputs.go-changed }}
      go-version: ${{ steps.detect.outputs.go-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version changes
        id: detect
        run: |
          ver() { if [ "$1" = bindings/go/VERSION ]; then tr -d '[:space:]'; else awk -F'[" ]+' '/^version[[:space:]]*=/ {print $3; exit}'; fi; }
          tags=$(git ls-remote --tags origin)
          { echo "| Component | Previous | Current | Changed |"; echo "|---|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          while read -r key file prefix; do
            cur=$(ver "$file" < "$file")
            prev_commit=$(git log --format=%H -2 -- "$file" | tail -1)
            prev=$(git show "$prev_commit:$file" 2>/dev/null | ver "$file" || true)
            changed=true
            grep -q "refs/tags/$prefix$cur$" <<<"$tags" && changed=false
            { echo "$key-version=$cur"; echo "$key-changed=$changed"; } >> "$GITHUB_OUTPUT"
            echo "| $key | $prev | $cur | $changed |" >> "$GITHUB_STEP_SUMMARY"
          done <<'EOF'
          types crates/types/Cargo.toml types-v
          core crates/core/Cargo.toml core-v
          server crates/server/Cargo.toml server-v
          client crates/client/Cargo.toml client-v
          python bindings/python/Cargo.toml python-v
          cabi crates/cabi/Cargo.toml cabi-v
          go bindings/go/VERSION bindings/go/v
          EOF

  # ---------------- STAGE 3: RELEASE ----------------
  release-types:
    name: Release spatio-types
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.types-changed == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish and tag spatio-types
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: ./scripts/release-crate.sh spatio-types types-v "${{ needs.detect-changes.outputs.types-version }}"

  release-core:
    name: Release spatio core
    runs-on: ubuntu-latest
    needs: [detect-changes, release-types]
    if: |
      always() &&
      needs.detect-changes.outputs.core-changed == 'true' &&
      (needs.release-types.result == 'success' || needs.release-types.result == 'skipped')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish and tag spatio
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: ./scripts/release-crate.sh spatio core-v "${{ needs.detect-changes.outputs.core-version }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-changes.outputs.core-version }}
        run: |
          TAG="core-v$VERSION"
          NOTES="crates/benchmarks/results/core-v$VERSION.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --title "spatio $VERSION" --notes-file "$NOTES" \
              || gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "spatio $VERSION" --generate-notes || true
          fi

  release-server:
    name: Release spatio server
    runs-on: ubuntu-latest
    needs: [detect-changes, release-core]
    if: |
      always() &&
      needs.detect-changes.outputs.server-changed == 'true' &&
      (needs.release-core.result == 'success' || needs.release-core.result == 'skipped')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish and tag spatio-server
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: ./scripts/release-crate.sh spatio-server server-v "${{ needs.detect-changes.outputs.server-version }}"

  release-client:
    name: Release spatio-client
    runs-on: ubuntu-latest
    needs: [detect-changes, release-server]
    if: |
      always() &&
      needs.detect-changes.outputs.client-changed == 'true' &&
      (needs.release-server.result == 'success' || needs.release-server.result == 'skipped')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish and tag spatio-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: ./scripts/release-crate.sh spatio-client client-v "${{ needs.detect-changes.outputs.client-version }}"

  release-cabi:
    name: Release spatio-cabi
    runs-on: ubuntu-latest
    needs: [detect-changes, release-core]
    if: |
      always() &&
      needs.detect-changes.outputs.cabi-changed == 'true' &&
      (needs.release-core.result == 'success' || needs.release-core.result == 'skipped')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish and tag spatio-cabi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: ./scripts/release-crate.sh spatio-cabi cabi-v "${{ needs.detect-changes.outputs.cabi-version }}"

  build-go-artifacts:
    name: Build Go native libs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [detect-changes]
    if: needs.detect-changes.outputs.go-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build C-ABI cdylib
        shell: bash
        run: |
          cargo build -p spatio-cabi --release
          os=$(uname -s); arch=$(uname -m)
          case "$os" in
            Darwin) ext=dylib;;
            *)      ext=so;;
          esac
          case "$arch" in
            x86_64|amd64) goarch=amd64;;
            arm64|aarch64) goarch=arm64;;
            *) goarch=$arch;;
          esac
          goos=$(echo "$os" | tr '[:upper:]' '[:lower:]')
          out="libspatio_cabi-${goos}_${goarch}.${ext}"
          cp "target/release/libspatio_cabi.${ext}" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: go-lib-${{ matrix.os }}
          path: libspatio_cabi-*

  release-go:
    name: Release Go bindings
    runs-on: ubuntu-latest
    needs: [detect-changes, build-go-artifacts]
    if: needs.detect-changes.outputs.go-changed == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: go-libs
          pattern: go-lib-*
          merge-multiple: true

      # Tag in the form Go expects for a module in a subdirectory, then attach
      # the prebuilt native libs to the GitHub release. (Embedding these into
      # the module for a zero-config `go get` is tracked separately.)
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.detect-changes.outputs.go-version }}"
          TAG="bindings/go/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "Release go bindings $VERSION"
          git push origin "$TAG"
          gh release create "$TAG" go-libs/* \
            --title "Go bindings v$VERSION" \
            --notes "Prebuilt spatio-cabi native libraries for the Go bindings ($TAG)."

  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [detect-changes, release-server]
    if: needs.release-server.result == 'success'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.detect-changes.outputs.server-version }}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: crates/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-python-artifacts:
    name: Build Python Wheels (${{ matrix.platform.os }}, ${{ matrix.platform.target }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.platform.os }}
    needs: [detect-changes]
    if: needs.detect-changes.outputs.python-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          # Linux aarch64 (Raspberry Pi, ARM servers) via QEMU
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64
            manylinux: ""
          # Windows x86_64
          - os: windows-latest
            target: x86_64
            manylinux: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter python${{ matrix.python-version }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          working-directory: bindings/python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: bindings/python/dist/*.whl


  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-python-artifacts, detect-changes]
    if: needs.detect-changes.outputs.python-changed == 'true'
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to PyPI
        run: |
          python -m pip install --upgrade pip
          pip install "packaging>=24.1" twine
          twine check dist/*
          twine upload dist/*.whl --non-interactive --skip-existing

      - name: Tag and release
        run: |
          VERSION="${{ needs.detect-changes.outputs.python-version }}"
          TAG="python-v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "Release spatio-py $VERSION"
          git push origin "$TAG"

  # ---------------- STAGE 4: DOCS ----------------
  docs:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    needs: [wait-for-ci]
    if: success() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo doc -p spatio -p spatio-types -p spatio-client -p spatio-server --no-deps --all-features
          echo '<meta http-equiv="refresh" content="0; url=spatio">' > target/doc/index.html
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
      - uses: actions/deploy-pages@v4

  # ---------------- STAGE 5: SUMMARY ----------------
  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, release-types, release-client, release-core, release-server, publish-to-pypi, build-and-push-docker, release-cabi, release-go]
    if: always()
    steps:
      - run: |
          echo "### Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| spatio-types | ${{ needs.detect-changes.outputs.types-version }} | ${{ needs.release-types.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| spatio-client | ${{ needs.detect-changes.outputs.client-version }} | ${{ needs.release-client.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| spatio | ${{ needs.detect-changes.outputs.core-version }} | ${{ needs.release-core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| spatio-py | ${{ needs.detect-changes.outputs.python-version }} | ${{ needs.publish-to-pypi.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| spatio-server | ${{ needs.detect-changes.outputs.server-version }} | ${{ needs.release-server.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| spatio-cabi | ${{ needs.detect-changes.outputs.cabi-version }} | ${{ needs.release-cabi.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| go bindings | ${{ needs.detect-changes.outputs.go-version }} | ${{ needs.release-go.result }} |" >> $GITHUB_STEP_SUMMARY
